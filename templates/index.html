<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🌿 Родовой След</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/variables.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="stylesheet" href="/static/css/tree.css" />
</head>
<body>
    <div class="background-animation">
        <div class="bg-particle bg-particle-1"></div>
        <div class="bg-particle bg-particle-2"></div>
        <div class="bg-particle bg-particle-3"></div>
    </div>

    <header>
        <nav class="navbar">
            <div class="nav-brand">
                <div class="brand-icon">🌿</div>
                <h1>Родовой След</h1>
            </div>
            <div class="nav-links">
                <button data-section="searchSection" class="nav-btn active" title="Поиск" type="button">
                    <i class="fas fa-search"></i>
                </button>
                <button data-section="treeSection" class="nav-btn" title="Дерево" type="button">
                    <i class="fas fa-sitemap"></i>
                </button>
                
            </div>
        </nav>
    </header>

    <main>
        <!-- ВКЛАДКА 1: ПОИСК -->
        <section id="searchSection" class="section active">
            <div class="glass-card">
                <div class="section-header">
                    <h2><i class="fas fa-search"></i> Поиск в базе</h2>
                </div>

                <!-- ВАЖНО: теперь форма реально отправляет запрос в Django -->
                <form id="simpleSearchForm" class="modern-form-grid" method="get" action="/api/search/">
                    <!-- Главное поле: name="q" -->
                    <input
                        type="text"
                        id="searchFio"
                        name="q"
                        placeholder="Имя, фамилия или отчество"
                        value=""
                        required
                    >

                    <!-- Доп. поля оставлены для интерфейса (пока не используются на backend) -->
                    <select id="searchGender" name="gender">
                        <option value="">Любой пол</option>
                        <option value="1">Мужской</option>
                        <option value="0">Женский</option>
                    </select>

                    <input type="number" id="searchYear" name="year" placeholder="Примерный год рождения" min="0" step="1">
                    <input type="number" id="searchRange" name="range" value="5" min="0" max="20" placeholder="Диапазон (лет)">

                    <button type="submit" class="btn-primary">Получить результат</button>
                </form>

                <!-- Если хочешь, можно показывать подсказку прямо на главной -->
                <div id="searchResultBox" style="margin-top: 1.5rem;"></div>
            </div>
        </section>

        <!-- ВКЛАДКА 2: ДЕРЕВО -->
        <section id="treeSection" class="section">
            <div class="glass-card">
                <div class="section-header">
                    <h2><i class="fas fa-tree"></i> Постройте своё дерево</h2>
                </div>

                <!-- Основной человек -->
                <div class="modern-form-grid">
                    <input type="text" id="selfName" placeholder="Ваше имя">
                    <input type="text" id="selfSurname" placeholder="Ваша фамилия">
                    <select id="selfGender">
                        <option value="1">Мужской</option>
                        <option value="0">Женский</option>
                    </select>
                    <input type="number" id="selfBirth" placeholder="Год рождения">
                    <button type="button" class="btn-primary" onclick="addSelf()">Добавить себя</button>
                </div>

                <!-- Кнопка добавления -->
                <div style="margin-top: 2rem; text-align: center;">
                    <button type="button" class="btn-secondary" onclick="addRelativeForm()">
                        + Добавить родственника
                    </button>
                </div>

                <!-- Контейнер для формы (будет заменяться) -->
                <div id="relativesFormsContainer" style="margin-top: 1.5rem;"></div>

                <!-- Кнопка построения -->
                <div style="margin-top: 2rem; text-align: center;">
                    <button type="button" class="btn-primary" onclick="buildTree()" style="padding: 1rem 2rem; font-size: 1.1rem;">
                        🌳 Построить дерево
                    </button>
                </div>
            </div>

            <!-- Контейнер для дерева -->
            <div id="treeContainer" class="tree-container" style="margin-top: 2rem;"></div>
        </section>


    </main>

    <script src="/static/js/api.js"></script>

    <!-- ВАЖНО: отключено, чтобы не перехватывало submit и не показывало "Ошибка поиска" -->
    <!-- <script src="/static/js/simpleSearch.js"></script> -->

    <script src="/static/js/tree.js"></script>

    <script src="/static/js/app.js"></script>

    <script>
        window.showLogin = () => {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('userProfile').style.display = 'none';
        };
        window.showRegister = () => {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('userProfile').style.display = 'none';
        };
    </script>
</body>
</html>
